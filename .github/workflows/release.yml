name: Release

# 推送到 main / master 时自动检查 package.json 版本：
# - v<version> 标签不存在 → 构建、打包并发布 GitHub Release
# - v<version> 标签已存在 → 跳过发布（版本相同不重复发布）
# 也可以在 Actions 页面手动触发，用于补发当前版本。
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

# 同一分支串行执行，避免并发推送时重复创建同一个版本的 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version change
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release skipped::Tag ${tag} already exists. Bump the version in package.json to publish a new release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release started::Preparing ${tag}."
          fi

  release:
    name: Build and publish
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package
        run: pnpm package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: release/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
